; Queue worker за padok.bg
;
; Нужен е, защото QUEUE_CONNECTION=database, а нюзлетърът (ConfirmSubscriptionMail)
; и седмичният дайджест ползват Mail::queue(). Без работещ worker тези писма
; седят в таблицата jobs завинаги — БЕЗ грешка и без следа в лога.
;
; Инсталиране (като root на сървъра):
;   cp docs/supervisor-padok-queue.conf /etc/supervisor/conf.d/padok-queue.conf
;   supervisorctl reread && supervisorctl update && supervisorctl start padok-queue:*
;
; Проверка:
;   supervisorctl status padok-queue:*
;   sudo -u www-data php artisan queue:monitor database --max=50
;
; ВАЖНО: worker-ът зарежда кода веднъж при старт. deploy.sh го рестартира;
; ако деплойваш ръчно — `php artisan queue:restart` след промени в код.

[program:padok-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/f1bulgaria/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --backoff=60
directory=/var/www/f1bulgaria
user=www-data
autostart=true
autorestart=true
; Един процес стига за този обем (нюзлетър + седмичен дайджест).
numprocs=1
; --max-time=3600 рестартира worker-а на всеки час — предпазва от изтичане на
; памет при дълго работещи процеси и подхваща нов код без ръчна намеса.
startsecs=5
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/f1bulgaria/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
