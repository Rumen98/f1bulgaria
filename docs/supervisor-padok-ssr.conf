; Inertia SSR демон за padok.bg
;
; Инсталиране (като root на сървъра):
;   cp docs/supervisor-padok-ssr.conf /etc/supervisor/conf.d/padok-ssr.conf
;   supervisorctl reread && supervisorctl update && supervisorctl start padok-ssr
;
; Проверка:
;   supervisorctl status padok-ssr
;   sudo -u www-data php artisan inertia:check-ssr
;
; Демонът НЕ следи bundle файла — рестартирай го при всеки деплой
; (deploy.sh го прави).

[program:padok-ssr]
process_name=%(program_name)s
command=php /var/www/f1bulgaria/artisan inertia:start-ssr
directory=/var/www/f1bulgaria
user=www-data
autostart=true
autorestart=true
; Ако падне повече от 3 пъти за 10 сек, supervisor спира да опитва —
; значи bundle-ът е счупен, не е временен проблем.
startretries=3
startsecs=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/www/f1bulgaria/storage/logs/ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
